<script>
const DATA=JSON.parse(document.getElementById('data').textContent), cards=DATA.cards;
const $=id=>document.getElementById(id);
function el(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}
function link(label,url){const n=el('a',label);n.href=url;n.target='_blank';n.rel='noopener';return n}
for(const c of [...new Set(cards.map(x=>x.category))]){const n=el('option',c);n.value=c;$('cat').append(n)}
for(const c of [...new Set(cards.map(x=>x.role_label))]){const n=el('option',c);n.value=c;$('role').append(n)}
function render(){const q=$('q').value.trim().toLowerCase();const found=cards.filter(c=>(!$('cat').value||c.category===$('cat').value)&&(!$('role').value||c.role_label===$('role').value)&&(!q||[c.id,c.title,c.category,c.select_when,...c.relations].join(' ').toLowerCase().includes(q)));
$('count').textContent=`找到 ${found.length} / 108 套候选。研究完成 ≠ 已接入 V5 或已通过成片验证。`;$('cards').replaceChildren();
for(const c of found){const n=el('article',undefined,'card');n.append(el('h2',c.title),el('div',c.id,'id'),el('div',`${c.category} · ${c.role_label} · ${c.relations.join(' / ')}`,'tags'));
const img=el('img');img.addEventListener('error',()=>img.replaceWith(el('p','预览图保存在本地；可通过下方笔记和源码查看过程。','muted')),{once:true});img.src=`previews/${c.id}.jpg`;img.alt='上游演示三个取样状态';img.loading='lazy';n.append(img,el('p','适合：'+c.select_when),el('p','避免：'+c.avoid_when,'warn'));
if(c.status.upstream_keyframes.sample_warning)n.append(el('p','取样限制：'+c.status.upstream_keyframes.sample_warning,'warn'));
const d=el('details');d.append(el('summary','展开动作过程与适配提醒'));const seq=el('ol');for(const s of c.sequence)seq.append(el('li',s));d.append(seq,el('p','配音落点：'+c.narration_anchor),el('p','V5 适配：'+c.v5_adaptation));const pitfalls=el('ul');for(const s of c.pitfalls)pitfalls.append(el('li',s));d.append(pitfalls);
const links=el('div',undefined,'links');links.append(link('本地演示（部分需媒体）',`upstream/demos/${c.id}/index.html?embed=1`),link('逐卡笔记',`cards/${c.id}.md`),link('完整配方',c.sources.recipe.local),link('TSX 源码',c.sources.tsx.local));d.append(links,el('p','关键帧仅为研究取样；未执行正常速度主观审片、V5 生产适配或剪映原生验证。','muted'));n.append(d);$('cards').append(n)}
if(!found.length)$('cards').append(el('p','可尝试“比较、顺序、汇聚、数量、强调、证据”等关系词。','empty'))}
for(const id of ['q','cat','role'])$(id).addEventListener(id==='q'?'input':'change',render);render();
